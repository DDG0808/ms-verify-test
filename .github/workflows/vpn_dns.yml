name: VPN DNS Fix
on: workflow_dispatch
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq openvpn
        pip install -q playwright
        playwright install chromium --with-deps 2>/dev/null || playwright install chromium
    - name: Connect VPN
      run: |
        OLD_IP=$(curl -s --max-time 5 http://api.ipify.org)
        echo "VPN前: $OLD_IP"
        sudo openvpn --config vpn_2.ovpn --daemon --log /tmp/vpn.log --writepid /tmp/vpn.pid
        for i in $(seq 1 40); do
          sleep 3
          NEW_IP=$(curl -s --max-time 5 http://api.ipify.org 2>/dev/null || echo "")
          if [ -n "$NEW_IP" ] && [ "$NEW_IP" != "$OLD_IP" ]; then
            echo "VPN IP: $NEW_IP"
            break
          fi
        done
        sleep 3
        FINAL=$(curl -s --max-time 5 http://api.ipify.org)
        echo "出口: $FINAL"
        if [ "$FINAL" == "$OLD_IP" ]; then
          echo "!! VPN未生效"
          exit 1
        fi
    - name: Fix DNS
      run: |
        sudo bash -c 'echo "nameserver 8.8.8.8" > /etc/resolv.conf'
        sudo bash -c 'echo "nameserver 1.1.1.1" >> /etc/resolv.conf'
        echo "DNS: $(nslookup signup.live.com 2>&1 | grep Address | tail -1)"
        nslookup signup.live.com 8.8.8.8 2>&1 | head -5
    - name: Register
      run: python register_final.py
      timeout-minutes: 10
    - name: Stop VPN
      if: always()
      run: sudo kill $(cat /tmp/vpn.pid) 2>/dev/null || true
    - name: Upload
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: result
        path: /tmp/result.json
        if-no-files-found: ignore
